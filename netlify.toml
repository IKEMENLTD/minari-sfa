[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# 通常 functions の timeout (sync max 26秒, Background Function は最大15分で別系統)
[functions."*"]
  execution_timeout = 26

# Background Function は -background サフィックスで自動認識、15分まで実行可
# PhaseS: 旧 [[redirects]] (identity rewrite) は plugin と競合して 405 を引き起こすため削除
# Netlify plugin の default routing で /.netlify/functions/<name> → 関数本体に到達する
